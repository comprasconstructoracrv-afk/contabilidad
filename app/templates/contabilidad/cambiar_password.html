<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar contraseña</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">

    <style>
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #5b6b82;
        }

        .toggle-password:hover {
            color: #2f6fed;
        }
    </style>
<link rel="stylesheet" href="{{ url_for('static', filename='global-font.css') }}">
</head>

<body>

<div class="login-page">
    <div class="login-card">

        <div class="login-logo-box">
            <img src="{{ url_for('static', filename='logo_crv.png') }}" class="login-logo">
        </div>

        <h1>Cambiar contraseña</h1>
        <p class="login-subtitle">Actualiza tu acceso al sistema</p>

        {% if mensaje %}
        <div class="alert-success">{{ mensaje }}</div>
        {% endif %}

        {% if error %}
        <div class="alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST">

            <!-- CONTRASEÑA ACTUAL -->
            <div class="form-group">
                <label>Contraseña actual</label>
                <div class="password-wrapper">
                    <input type="password" id="actual" name="actual" required>
                    <button type="button" class="toggle-password" onclick="toggle('actual', this)">👁</button>
                </div>
            </div>

            <!-- NUEVA -->
            <div class="form-group">
                <label>Nueva contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="nueva" name="nueva" required>
                    <button type="button" class="toggle-password" onclick="toggle('nueva', this)">👁</button>
                </div>
            </div>

            <!-- CONFIRMAR -->
            <div class="form-group">
                <label>Confirmar contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmar" name="confirmar" required>
                    <button type="button" class="toggle-password" onclick="toggle('confirmar', this)">👁</button>
                </div>
            </div>

            <button type="submit" class="btn-login">Guardar cambios</button>
        </form>

        <div class="login-links">
            <a href="/empresas">← Volver</a>
        </div>

    </div>
</div>

<script>
    function toggle(id, btn) {
        const input = document.getElementById(id);

        if (input.type === "password") {
            input.type = "text";
            btn.textContent = "🙈";
        } else {
            input.type = "password";
            btn.textContent = "👁";
        }
    }
</script>

</body>
</html>
