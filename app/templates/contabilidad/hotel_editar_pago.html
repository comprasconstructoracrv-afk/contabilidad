<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ empresa_nombre }} - Editar pago</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .hotel-abono-shell {
            max-width: 1000px;
            margin: 0 auto 40px;
            padding: 20px;
        }

        .hotel-abono-card {
            background: #fff;
            border-radius: 22px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.10);
            padding: 24px;
        }

        .hotel-abono-title {
            color: {{ config.color_primario }};
            margin-top: 0;
            font-size: 36px;
            font-weight: 800;
        }

        .hotel-box {
            background: #fafafc;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 18px;
        }

        .hotel-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .hotel-group {
            display: flex;
            flex-direction: column;
        }

        .hotel-group.full {
            grid-column: 1 / -1;
        }

        .hotel-group label {
            font-weight: 700;
            color: {{ config.color_primario }};
            margin-bottom: 6px;
        }

        .hotel-group input,
        .hotel-group textarea,
        .hotel-group select {
            padding: 12px;
            border: 1px solid #dbe2ea;
            border-radius: 12px;
        }

        .hotel-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        @media (max-width: 720px) {
            .hotel-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="hotel-abono-shell">
    <div class="hotel-abono-card">
        <h1 class="hotel-abono-title">{{ empresa_nombre }} - Editar pago</h1>

        <div class="hotel-box">
            <p><strong>Venta:</strong> #{{ venta.consecutivo_venta }}</p>
            <p><strong>Recibo:</strong> #{{ "%02d"|format(pago.consecutivo_recibo) }}</p>
            <p><strong>Cliente:</strong> {{ venta.cliente }}</p>
            <p><strong>Saldo actual venta:</strong> ${{ "{:,.0f}".format(venta.saldo_pendiente) }}</p>
        </div>

        <form method="POST">
            <div class="hotel-grid">
                <div class="hotel-group">
                    <label>Fecha</label>
                    <input type="date" name="fecha" value="{{ pago.fecha.strftime('%Y-%m-%d') }}" required>
                </div>

                <div class="hotel-group">
                    <label>Valor pagado</label>
                    <input type="number" step="0.01" name="valor_pagado" value="{{ pago.valor_pagado }}" required>
                </div>

                <div class="hotel-group">
                    <label>Forma de pago</label>
                    <select name="forma_pago">
                        <option value="">Seleccione</option>
                        <option value="Transferencia" {% if pago.forma_pago == 'Transferencia' %}selected{% endif %}>Transferencia</option>
                        <option value="Efectivo" {% if pago.forma_pago == 'Efectivo' %}selected{% endif %}>Efectivo</option>
                        <option value="Consignación" {% if pago.forma_pago == 'Consignación' %}selected{% endif %}>Consignación</option>
                        <option value="Nequi" {% if pago.forma_pago == 'Nequi' %}selected{% endif %}>Nequi</option>
                    </select>
                </div>

                <div class="hotel-group">
                    <label>Entidad de pago</label>
                    <input type="text" name="entidad_pago" value="{{ pago.entidad_pago if pago.entidad_pago else '' }}">
                </div>

                <div class="hotel-group">
                    <label>Cuenta destino</label>
                    <input type="text" name="cuenta_destino" value="{{ pago.cuenta_destino if pago.cuenta_destino else '' }}">
                </div>

                <div class="hotel-group full">
                    <label>Observación</label>
                    <textarea name="observacion" rows="3">{{ pago.observacion if pago.observacion else '' }}</textarea>
                </div>
            </div>

            <div class="hotel-actions">
                <button type="submit" class="btn-primary">Guardar cambios</button>
                <a href="/hotel-sky-view/ventas" class="btn-secondary">Volver</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
