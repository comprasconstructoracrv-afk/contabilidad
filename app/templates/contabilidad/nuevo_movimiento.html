<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Movimiento</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='global-font.css') }}">
</head>
<body>

    <div class="page-header">
        <h1>{{ empresa_nombre }} - Registrar Movimiento</h1>
        <p>Registra ingresos y gastos de forma clara y organizada</p>
    </div>

    <div class="empresa-actual-bar">
        <div class="empresa-actual-info">
            <span class="empresa-badge">Empresa activa</span>
            <strong>{{ empresa_nombre }}</strong>
        </div>

        <div class="empresa-actual-actions">
            <a href="/empresas" class="btn-secondary">Cambiar empresa</a>
            <a href="/sedes" class="btn-secondary">Gestionar sedes</a>
        </div>
    </div>

    <div class="form-container">
        <div class="form-card">
            <form method="POST" class="movimiento-form">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="fecha">Fecha</label>
                        <input type="date" name="fecha" id="fecha" required>
                    </div>

                    <div class="form-group">
                        <label for="tipo">Tipo</label>
                        <select name="tipo" id="tipo" required onchange="actualizarCategorias(); actualizarCuentas();">
                            <option value="">Seleccione</option>
                            <option value="INGRESO">Ingreso</option>
                            <option value="GASTO">Gasto</option>
                        </select>
                    </div>

                    {% if sedes %}
                    <div class="form-group form-group-full">
                        <label for="sede_id">Sede</label>
                        <select name="sede_id" id="sede_id">
                            <option value="">General / Sin sede</option>
                            {% for sede in sedes %}
                            <option value="{{ sede.id }}">{{ sede.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    {% endif %}

                    <div class="form-group form-group-full">
                        <label for="categoria">Categoría</label>
                        <select name="categoria" id="categoria" required onchange="mostrarOtroCategoria()">
                            <option value="">Seleccione primero un tipo</option>
                        </select>
                    </div>

                    <div class="form-group form-group-full" id="otro_categoria_div" style="display:none;">
                        <label for="otra_categoria">Otra categoría</label>
                        <input type="text" name="otra_categoria" id="otra_categoria" placeholder="Escriba la categoría">
                    </div>

                    <div class="form-group form-group-full">
                        <label for="cuenta">Cuenta / Medio por donde entra o sale</label>
                        <select name="cuenta" id="cuenta" onchange="mostrarOtraCuenta()" required>
                            <option value="">Seleccione primero un tipo</option>
                        </select>
                    </div>

                    <div class="form-group form-group-full" id="otra_cuenta_div" style="display:none;">
                        <label for="otra_cuenta">Otra cuenta / medio</label>
                        <input type="text" name="otra_cuenta" id="otra_cuenta" placeholder="Ej: Caja menor obra, Davivienda, otro banco">
                    </div>

                    <div class="form-group form-group-full">
                        <label for="tercero">Tercero / Proveedor / Cliente</label>
                        <input type="text" name="tercero" id="tercero" placeholder="Ej: DIAN, CEMEX, ARTESCO, CLIENTE JUAN PÉREZ">
                    </div>

                    <div class="form-group">
                        <label for="valor">Valor</label>
                        <input type="number" step="0.01" name="valor" id="valor" placeholder="Ej: 250000" required>
                    </div>

                    <div class="form-group form-group-full">
                        <label for="descripcion">Descripción</label>
                        <textarea name="descripcion" id="descripcion" rows="4" placeholder="Detalle del movimiento"></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Guardar movimiento</button>
                    <a href="/movimientos" class="btn-secondary">Ver movimientos</a>
                    <a href="/dashboard" class="btn-secondary">Volver al dashboard</a>
                </div>

            </form>
        </div>
    </div>

    <script>
        function actualizarCategorias() {
            const tipo = document.getElementById("tipo").value;
            const categoria = document.getElementById("categoria");
            const divOtro = document.getElementById("otro_categoria_div");
            const inputOtro = document.getElementById("otra_categoria");

            categoria.innerHTML = '<option value="">Seleccione una categoría</option>';
            divOtro.style.display = "none";
            inputOtro.value = "";

            let opciones = [];

            if (tipo === "INGRESO") {
                opciones = ["Venta", "Abono crédito", "Ingreso extra", "Otro"];
            } else if (tipo === "GASTO") {
                opciones = ["Compra material obra", "Transporte", "Servicios", "Arriendos", "Nómina planta", "Nómina obra", "Papelería", "Otro"];
            }

            opciones.forEach(function(opcion) {
                const option = document.createElement("option");
                option.value = opcion;
                option.textContent = opcion;
                categoria.appendChild(option);
            });
        }

        function mostrarOtroCategoria() {
            const categoria = document.getElementById("categoria").value;
            const divOtro = document.getElementById("otro_categoria_div");

            divOtro.style.display = (categoria === "Otro") ? "block" : "none";
        }

        function actualizarCuentas() {
            const tipo = document.getElementById("tipo").value;
            const cuenta = document.getElementById("cuenta");
            const divOtra = document.getElementById("otra_cuenta_div");
            const inputOtra = document.getElementById("otra_cuenta");

            cuenta.innerHTML = '<option value="">Seleccione una cuenta / medio</option>';
            divOtra.style.display = "none";
            inputOtra.value = "";

            let opciones = [];

            if (tipo === "INGRESO") {
                opciones = [
                    "EFECTIVO",
                    "BANCOLOMBIA SAS",
                    "BANCOLOMBIA ING",
                    "NEQUI ING",
                    "BANCOLOMBIA SRA ALISA",
                    "BOLD SRA ALISA",
                    "OTRO"
                ];
            } else if (tipo === "GASTO") {
                opciones = [
                    "EFECTIVO",
                    "BANCOLOMBIA SAS",
                    "BANCOLOMBIA ING",
                    "NEQUI ING",
                    "BANCOLOMBIA SRA ALISA",
                    "BOLD SRA ALISA",
                    "OTRO"
                ];
            }

            opciones.forEach(function(opcion) {
                const option = document.createElement("option");
                option.value = opcion;
                option.textContent = opcion;
                cuenta.appendChild(option);
            });
        }

        function mostrarOtraCuenta() {
            const cuenta = document.getElementById("cuenta").value;
            const divOtra = document.getElementById("otra_cuenta_div");
            divOtra.style.display = (cuenta === "OTRO") ? "block" : "none";
        }
    </script>

</body>
</html>
